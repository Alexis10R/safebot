<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAFE - Cleanroom Simulator</title>
    <style>
        :root {
            --floor: #e2e8f0; --wall: #1e293b; --table: #94a3b8;
            --accent: #0284c7; --text: #f8fafc;
            --tile: 45px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #0f172a; color: var(--text); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }

        #game-wrapper {
            background: var(--wall); width: 100%; max-width: 450px; border-radius: 12px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); overflow: hidden; display: flex; flex-direction: column;
            border: 2px solid #334155;
        }

        #status-bar {
            background: #0f172a; padding: 12px; display: flex; flex-direction: column; gap: 8px;
            font-size: 14px; font-weight: bold; border-bottom: 2px solid var(--accent);
        }
        
        .header-row { display: flex; justify-content: space-between; align-items: center; }
        
        #inventory-bar {
            display: flex; gap: 5px; height: 30px; background: #1e293b; padding: 2px; border-radius: 4px;
        }
        .inv-slot { width: 26px; height: 26px; background: #334155; border-radius: 4px; padding: 2px; }

        #game-screen {
            width: 100%; aspect-ratio: 1/1; background: var(--floor); position: relative;
            background-image: 
                linear-gradient(rgba(148, 163, 184, 0.3) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(148, 163, 184, 0.3) 1px, transparent 1px);
            background-size: var(--tile) var(--tile);
        }

        .furniture {
            position: absolute; background: linear-gradient(145deg, #cbd5e1, #94a3b8);
            border: 2px solid #64748b; border-radius: 4px; box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
        }
        
        .entity {
            width: var(--tile); height: var(--tile); position: absolute;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 15; transition: transform 0.1s;
        }
        .entity:active { transform: scale(0.85); }
        .entity svg { width: 80%; height: 80%; filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3)); pointer-events: none; }

        @media (hover: hover) {
            .entity:hover::after {
                content: attr(data-name);
                position: absolute; bottom: 100%; left: 50%;
                transform: translateX(-50%) translateY(-5px);
                background: rgba(15, 23, 42, 0.9); color: white; padding: 4px 8px; border-radius: 4px;
                font-size: 11px; white-space: nowrap; pointer-events: none; z-index: 20; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
                animation: fadeIn 0.2s forwards;
            }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Menú de Acción */
        #action-menu {
            position: absolute; background: white; border: 2px solid var(--accent);
            border-radius: 8px; padding: 8px; display: none; flex-direction: column;
            align-items: center; gap: 6px; z-index: 50; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transform: translate(-50%, -110%);
        }
        #action-menu::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px;
            border-width: 6px; border-style: solid; border-color: var(--accent) transparent transparent transparent;
        }
        #action-title { font-size: 12px; color: #0f172a; font-weight: bold; white-space: nowrap; }
        .action-btns { display: flex; gap: 8px; }
        .btn-act { 
            padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; 
            font-size: 12px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center;
        }
        .btn-yes { background: #16a34a; } .btn-yes:active { background: #15803d; }
        .btn-no { background: #dc2626; } .btn-no:active { background: #b91c1c; }

        /* Jugador */
        #player {
            width: var(--tile); height: var(--tile); position: absolute; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: top 0.25s linear, left 0.25s linear;
        }
        #player svg { width: 90%; height: 90%; filter: drop-shadow(0px 6px 4px rgba(0,0,0,0.4)); transition: all 0.2s; }
        
        .walking svg { animation: walkCycle 0.25s infinite alternate ease-in-out; }
        @keyframes walkCycle { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-4px) rotate(2deg); } }
        .action-fx svg { animation: actionPop 0.4s ease-out; }
        @keyframes actionPop { 0% { transform: scale(1); filter: brightness(1.5); } 100% { transform: scale(1); filter: brightness(1); } }
        .error-blink svg { animation: errorBlink 0.8s infinite; }
        @keyframes errorBlink { 50% { filter: drop-shadow(0 0 8px red); } }

        #dialogue-box {
            background: #f8fafc; padding: 15px; height: 90px;
            font-size: 14px; font-weight: bold; color: #0f172a; line-height: 1.4;
            display: flex; align-items: center; text-align: left; border-top: 3px solid #cbd5e1;
        }
        #report-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #f8fafc;
            color: #0f172a; z-index: 100; display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .report-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #cbd5e1; font-size: 13px; }
        .score-good { color: #16a34a; font-weight: bold; }
        .score-bad { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="status-bar">
        <div class="header-row">
            <span id="room-name">Filtro de Ingreso</span>
            <span style="font-size: 12px; color: #94a3b8;">GESSM-F02-I156-GRL</span>
        </div>
        <div id="inventory-bar"></div>
    </div>

    <div style="position: relative; width: 100%;">
        <div id="game-screen">
            <div id="furniture-container"></div>
            <div id="entities-container"></div>
            <div id="player" onclick="inspectPlayer()"></div>
            
            <div id="action-menu">
                <div id="action-title">¿Usar objeto?</div>
                <div class="action-btns">
                    <button class="btn-act btn-yes" id="btn-act-yes">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                    <button class="btn-act btn-no" id="btn-act-no">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="report-screen">
            <h2 style="text-align: center; margin-bottom: 10px;">Reporte GESSM-F02-I156-GRL</h2>
            <div id="report-content" style="flex: 1;"></div>
            <h3 id="final-score" style="text-align: center; margin: 15px 0;"></h3>
            <button onclick="location.reload()" style="padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;">Reevaluar</button>
        </div>
    </div>

    <div id="dialogue-box">Toca una casilla para caminar.<br>Toca un objeto para interactuar.<br>Toca a tu personaje para revisarte.</div>
</div>

<script>
    const TILE = 45;
    const playerEl = document.getElementById('player');
    const entitiesEl = document.getElementById('entities-container');
    const furnitureEl = document.getElementById('furniture-container');
    const dialogueEl = document.getElementById('dialogue-box');
    const invEl = document.getElementById('inventory-bar');
    const roomNameEl = document.getElementById('room-name');
    const actionMenu = document.getElementById('action-menu');

    // === LIBRERÍA SVG ===
    const SVGs = {
        door: `<svg viewBox="0 0 100 100"><rect x="20" y="10" width="60" height="90" fill="#8b5cf6" rx="4"/><rect x="65" y="50" width="8" height="15" fill="#fde047" rx="2"/></svg>`,
        mirror: `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="30" ry="45" fill="#38bdf8" stroke="#cbd5e1" stroke-width="6"/><path d="M 40 20 L 70 80" stroke="white" stroke-width="4" opacity="0.5"/></svg>`,
        sink: `<svg viewBox="0 0 100 100"><rect x="10" y="20" width="80" height="60" fill="#e2e8f0" rx="10"/><circle cx="50" cy="50" r="20" fill="#94a3b8"/><rect x="45" y="10" width="10" height="25" fill="#cbd5e1"/></svg>`,
        dryer: `<svg viewBox="0 0 100 100"><rect x="25" y="20" width="50" height="60" fill="#f1f5f9" rx="8"/><rect x="35" y="60" width="30" height="10" fill="#0284c7"/><path d="M 40 80 Q 50 100 60 80" stroke="#38bdf8" stroke-width="4" fill="none"/></svg>`,
        bottle: (color) => `<svg viewBox="0 0 100 100"><rect x="30" y="40" width="40" height="50" fill="${color}" rx="8"/><rect x="40" y="15" width="20" height="25" fill="#e2e8f0"/><rect x="30" y="10" width="30" height="8" fill="#94a3b8" rx="4"/></svg>`,
        trash: `<svg viewBox="0 0 100 100"><rect x="20" y="30" width="60" height="60" fill="#64748b" rx="5"/><rect x="15" y="20" width="70" height="10" fill="#475569" rx="2"/></svg>`,
        bench: `<svg viewBox="0 0 100 100"><rect x="10" y="40" width="80" height="20" fill="#d97706" rx="4"/><rect x="20" y="60" width="10" height="30" fill="#b45309"/><rect x="70" y="60" width="10" height="30" fill="#b45309"/></svg>`,
        clothing: (type) => {
            const defs = {
                'cofia': `<path d="M 20 60 Q 50 20 80 60 Q 50 70 20 60 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>`,
                'cubrebocas': `<rect x="25" y="40" width="50" height="30" fill="#38bdf8" rx="5"/><line x1="10" y1="55" x2="25" y2="55" stroke="white" stroke-width="2"/><line x1="75" y1="55" x2="90" y2="55" stroke="white" stroke-width="2"/>`,
                'shoes': `<path d="M 20 70 L 45 70 L 45 40 Q 20 40 20 70 Z" fill="#94a3b8"/><path d="M 55 70 L 80 70 L 80 40 Q 55 40 55 70 Z" fill="#94a3b8"/>`,
                'shoes2': `<path d="M 20 70 L 45 70 L 45 40 Q 20 40 20 70 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><path d="M 55 70 L 80 70 L 80 40 Q 55 40 55 70 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>`,
                'guantes': `<path d="M 20 30 Q 35 10 45 30 L 45 80 L 20 80 Z" fill="#f1f5f9"/><path d="M 55 30 Q 65 10 80 30 L 80 80 L 55 80 Z" fill="#f1f5f9"/>`,
                'escafandra': `<path d="M 20 80 L 20 20 Q 50 0 80 20 L 80 80 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><rect x="35" y="30" width="30" height="15" fill="#1e293b"/>`,
                'overol': `<rect x="25" y="10" width="50" height="80" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="2"/><line x1="50" y1="10" x2="50" y2="90" stroke="#cbd5e1" stroke-width="2"/>`,
                'goggles': `<rect x="20" y="40" width="60" height="20" fill="rgba(56,189,248,0.5)" rx="8" stroke="#0284c7" stroke-width="4"/>`,
                'gorra': `<path d="M 20 60 Q 50 20 80 60 Z" fill="#ef4444"/><rect x="70" y="50" width="20" height="10" fill="#ef4444" rx="3"/>`
            };
            return `<svg viewBox="0 0 100 100">${defs[type]}</svg>`;
        }
    };

    function generatePlayerSVG() {
        let s = `<svg viewBox="0 0 100 100">`;
        let skin = '#fcd34d';
        let bodyColor = pState.looks.overol ? '#f8fafc' : '#0ea5e9';
        let stroke = pState.looks.overol ? 'stroke="#cbd5e1" stroke-width="2"' : '';
        let armColor = pState.looks.guantes ? '#f1f5f9' : bodyColor;

        s += `<rect x="35" y="75" width="12" height="20" fill="${bodyColor}" ${stroke}/>`;
        s += `<rect x="53" y="75" width="12" height="20" fill="${bodyColor}" ${stroke}/>`;
        if (pState.looks.zapatones2) { s += `<path d="M 30 95 L 47 95 L 47 85 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><path d="M 53 95 L 70 95 L 53 85 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>`; }
        else if (pState.looks.zapatones1) { s += `<path d="M 30 95 L 47 95 L 47 85 Z" fill="#94a3b8"/><path d="M 53 95 L 70 95 L 53 85 Z" fill="#94a3b8"/>`; }
        else { s += `<rect x="35" y="90" width="12" height="10" fill="#475569" rx="3"/><rect x="53" y="90" width="12" height="10" fill="#475569" rx="3"/>`; } 

        s += `<rect x="30" y="45" width="40" height="35" fill="${bodyColor}" rx="8" ${stroke}/>`;
        s += `<rect x="20" y="45" width="12" height="30" fill="${armColor}" rx="6" ${stroke}/>`;
        s += `<rect x="68" y="45" width="12" height="30" fill="${armColor}" rx="6" ${stroke}/>`;

        if (pState.room === 0 && pState.looks.reloj) s += `<rect x="18" y="65" width="16" height="5" fill="#64748b"/>`;

        if (pState.looks.escafandra) {
            s += `<path d="M 25 55 L 25 20 Q 50 0 75 20 L 75 50 Q 50 65 25 55 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>`;
            let visorColor = (pState.escaMalPuesta) ? '#ef4444' : '#1e293b';
            s += `<rect x="35" y="25" width="30" height="12" fill="${visorColor}" rx="4"/>`;
        } else {
            s += `<circle cx="50" cy="25" r="18" fill="${skin}"/>`;
            if (pState.room === 0 && pState.looks.aretes) {
                s += `<circle cx="32" cy="25" r="3" fill="#fbbf24"/><circle cx="68" cy="25" r="3" fill="#fbbf24"/>`;
            }
            if (pState.looks.cofia) s += `<path d="M 30 25 Q 50 5 70 25 Q 50 35 30 25 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>`;
            if (pState.looks.cubrebocas) s += `<rect x="35" y="28" width="30" height="12" fill="#38bdf8" rx="4"/>`;
        }
        if (pState.looks.goggles) s += `<rect x="32" y="22" width="36" height="14" fill="rgba(56,189,248,0.7)" rx="6" stroke="#0284c7" stroke-width="2"/>`;
        s += `</svg>`;
        return s;
    }

    // === ESTADO Y MAPAS ===
    let isMoving = false;
    let actionLog = [];
    let pState = {
        x: 4, y: 8, room: 0,
        looks: { aretes: true, reloj: true, cofia: false, cubrebocas: false, zapatones1: false, guantes: false, escafandra: false, overol: false, zapatones2: false, goggles: false },
        escaMalPuesta: false
    };

    const rooms = [
        {
            name: "Pasillo de Ingreso", furniture: [],
            entities: [
                { id: 'espejo', name: 'Espejo', x: 2, y: 3, svg: SVGs.mirror, action: () => showMsg("Reflejo: Tienes joyas puestas. Toca a tu personaje para retirarlas.") },
                { id: 'door1', name: 'Puerta V1', x: 4, y: 1, svg: SVGs.door, action: () => tryEnterRoom(1) }
            ]
        },
        {
            name: "Vestidor 1",
            furniture: [ { x: 1, y: 3, w: 1, h: 5 }, { x: 6, y: 2, w: 3, h: 2 } ],
            entities: [
                { id: 'door2', name: 'Puerta V2', x: 4, y: 1, svg: SVGs.door, action: () => tryEnterRoom(2) },
                { id: 'wash', name: 'Lavamanos', x: 1, y: 3, svg: SVGs.sink, action: () => doAction('wash', "Lavado de manos clínico completado.") },
                { id: 'dry', name: 'Secador', x: 1, y: 5, svg: SVGs.dryer, action: () => doAction('dry', "Secado total sin dejar gotas.") },
                { id: 'gel', name: 'Gel San.', x: 1, y: 7, svg: SVGs.bottle('#38bdf8'), action: () => doAction('gel', "Gel aplicado hasta los pliegues.") },
                { id: 'cofia', name: 'Cofia', x: 6, y: 2, svg: SVGs.clothing('cofia'), isItem: true },
                { id: 'cubrebocas', name: 'Cubrebocas', x: 7, y: 2, svg: SVGs.clothing('cubrebocas'), isItem: true },
                { id: 'zapatones1', name: 'Zapatones (Gris)', x: 8, y: 2, svg: SVGs.clothing('shoes'), isItem: true },
                { id: 'gorra', name: 'Gorra sucia', x: 7, y: 3, svg: SVGs.clothing('gorra'), action: () => doAction('error_gorra', "¡ERROR! Te colocaste ropa de calle en área gris.") }
            ]
        },
        {
            name: "Vestidor 2 (Guantes)",
            furniture: [ { x: 3, y: 4, w: 4, h: 2 } ],
            entities: [
                { id: 'door3', name: 'Puerta V3', x: 4, y: 1, svg: SVGs.door, action: () => tryEnterRoom(3) },
                { id: 'alcohol', name: 'Alcohol Estéril', x: 3, y: 4, svg: SVGs.bottle('#f8fafc'), action: () => doAction('alcohol', "Sanitización de manos completa.") },
                { id: 'guantes', name: 'Guantes Est.', x: 6, y: 4, svg: SVGs.clothing('guantes'), isItem: true }
            ]
        },
        {
            name: "Vestidor 3 (Aséptico)",
            furniture: [ { x: 1, y: 4, w: 1, h: 2 }, { x: 4, y: 4, w: 5, h: 2 } ],
            entities: [
                { id: 'door_fin', name: 'Área Blanca', x: 4, y: 1, svg: `<svg viewBox="0 0 100 100"><rect x="20" y="10" width="60" height="90" fill="#10b981" rx="4"/><circle cx="50" cy="50" r="10" fill="#f8fafc"/></svg>`, action: () => finishGame() },
                { id: 'alcohol2', name: 'Alcohol Estéril', x: 1, y: 4, svg: SVGs.bottle('#f8fafc'), action: () => doAction('alcohol', "Guantes sanitizados.") },
                { id: 'basura', name: 'Bote Basura', x: 1, y: 8, svg: SVGs.trash, action: () => doAction('error_basura', "¡ERROR CRÍTICO! Tocaste el bote de basura.") },
                { id: 'banca', name: 'Banca', x: 8, y: 8, svg: SVGs.bench, action: () => doAction('error_banca', "¡ERROR CRÍTICO! Te apoyaste en la banca.") },
                { id: 'escafandra', name: 'Escafandra', x: 4, y: 4, svg: SVGs.clothing('escafandra'), isItem: true, special: 'esca' },
                { id: 'overol', name: 'Overol Estéril', x: 5, y: 4, svg: SVGs.clothing('overol'), isItem: true },
                { id: 'zapatones2', name: 'Zapatones Est.', x: 6, y: 4, svg: SVGs.clothing('shoes2'), isItem: true },
                { id: 'goggles', name: 'Goggles', x: 7, y: 4, svg: SVGs.clothing('goggles'), isItem: true }
            ]
        }
    ];

    // === MOTOR LÓGICO Y UX INTERACTIVA ===
    function renderRoom(idx) {
        pState.room = idx;
        const room = rooms[idx];
        roomNameEl.innerText = room.name;
        pState.x = 4; pState.y = 8;
        updatePlayerPos();
        actionMenu.style.display = 'none';

        furnitureEl.innerHTML = '';
        room.furniture.forEach(f => {
            const div = document.createElement('div');
            div.className = 'furniture';
            div.style.left = (f.x * TILE) + 'px'; div.style.top = (f.y * TILE) + 'px';
            div.style.width = (f.w * TILE) + 'px'; div.style.height = (f.h * TILE) + 'px';
            furnitureEl.appendChild(div);
        });

        entitiesEl.innerHTML = '';
        room.entities.forEach(ent => {
            if (ent.isItem && pState.looks[ent.id]) return;
            const el = document.createElement('div');
            el.className = 'entity';
            el.setAttribute('data-name', ent.name);
            el.innerHTML = ent.svg;
            el.style.left = (ent.x * TILE) + 'px'; el.style.top = (ent.y * TILE) + 'px';
            
            el.onclick = (e) => {
                e.stopPropagation();
                let dx = Math.abs(pState.x - ent.x);
                let dy = Math.abs(pState.y - ent.y);
                
                // MEJORA: Si estás cerca, el menú se abre al instante.
                if (dx <= 1 && dy <= 1) {
                    openActionMenu(ent, el);
                } else {
                    walkTo(ent.x, ent.y, () => {
                        openActionMenu(ent, el);
                    });
                }
            };
            entitiesEl.appendChild(el);
        });
        
        document.getElementById('game-screen').onclick = (e) => {
            actionMenu.style.display = 'none';
            if (e.target.id === 'game-screen' || e.target.classList.contains('furniture')) {
                let rect = document.getElementById('game-screen').getBoundingClientRect();
                let tx = Math.floor((e.clientX - rect.left) / TILE);
                let ty = Math.floor((e.clientY - rect.top) / TILE);
                if (tx >= 0 && tx < 10 && ty >= 0 && ty < 10) walkTo(tx, ty);
            }
        };
    }

    function openActionMenu(ent, elementNode) {
        document.getElementById('action-title').innerText = ent.isItem ? `¿Tomar ${ent.name}?` : `¿Usar ${ent.name}?`;
        
        actionMenu.style.left = ((ent.x * TILE) + (TILE / 2)) + 'px';
        actionMenu.style.top = (ent.y * TILE) + 'px';
        actionMenu.style.display = 'flex';

        // Reasignar eventos limpiamente
        document.getElementById('btn-act-yes').onclick = (e) => {
            e.stopPropagation();
            actionMenu.style.display = 'none';
            if (ent.isItem) pickUp(ent, elementNode);
            else ent.action();
        };
        
        document.getElementById('btn-act-no').onclick = (e) => {
            e.stopPropagation();
            actionMenu.style.display = 'none';
        };
    }

    function walkTo(tx, ty, callback) {
        if (isMoving) return;
        isMoving = true;
        actionMenu.style.display = 'none';
        pState.x = tx; pState.y = ty;
        updatePlayerPos();
        playerEl.classList.add('walking');

        setTimeout(() => {
            isMoving = false;
            playerEl.classList.remove('walking');
            if (callback) callback();
        }, 300);
    }

    function updatePlayerPos() {
        playerEl.style.left = (pState.x * TILE) + 'px';
        playerEl.style.top = (pState.y * TILE) + 'px';
    }

    function showMsg(text) { dialogueEl.innerText = text; }

    function doAction(id, msg) {
        actionLog.push(id);
        showMsg(msg);
        playerEl.classList.remove('action-fx');
        void playerEl.offsetWidth; 
        playerEl.classList.add('action-fx');
    }

    function pickUp(ent, elementNode) {
        elementNode.remove();
        pState.looks[ent.id] = true;
        let msg = `Equipaste: ${ent.name.toUpperCase()}`;
        
        if (ent.special === 'esca' && Math.random() > 0.5) {
            pState.escaMalPuesta = true;
            playerEl.classList.add('error-blink');
            msg = "¡OJO! La escafandra te tapa los ojos. Tócate para acomodarla.";
        }
        
        doAction(ent.id, msg);
        updatePlayerState();
    }

    function inspectPlayer() {
        actionMenu.style.display = 'none';
        if (pState.room === 0) {
            if (pState.looks.aretes) { pState.looks.aretes = false; doAction('remove_aretes', "Aretes retirados."); }
            else if (pState.looks.reloj) { pState.looks.reloj = false; doAction('remove_reloj', "Reloj retirado."); }
            else showMsg("Estás listo para entrar.");
            updatePlayerState();
        } else if (pState.room === 3 && pState.escaMalPuesta) {
            pState.escaMalPuesta = false;
            playerEl.classList.remove('error-blink');
            doAction('fix_escafandra', "Escafandra corregida. Visión despejada.");
            updatePlayerState();
        } else {
            showMsg("Chequeo personal: Todo en orden.");
        }
    }

    function updatePlayerState() {
        playerEl.innerHTML = generatePlayerSVG();
        invEl.innerHTML = '';
        const order = ['cofia', 'cubrebocas', 'shoes', 'guantes', 'escafandra', 'overol', 'shoes2', 'goggles'];
        const keys = ['cofia', 'cubrebocas', 'zapatones1', 'guantes', 'escafandra', 'overol', 'zapatones2', 'goggles'];
        
        keys.forEach((key, index) => {
            if(pState.looks[key]) {
                let div = document.createElement('div');
                div.className = 'inv-slot';
                div.innerHTML = SVGs.clothing(order[index]);
                invEl.appendChild(div);
            }
        });
    }

    function tryEnterRoom(target) {
        if (pState.room === 0 && (pState.looks.aretes || pState.looks.reloj)) {
            showMsg("⚠️ ACCESO DENEGADO: Tócate para quitarte los accesorios antes de cruzar.");
            playerEl.classList.add('error-blink');
            setTimeout(() => playerEl.classList.remove('error-blink'), 800);
            return;
        }
        renderRoom(target);
    }

    // === EVALUADOR DINÁMICO MEJORADO (Corrección Bug) ===
    function finishGame() {
        document.getElementById('report-screen').style.display = 'flex';
        const content = document.getElementById('report-content');
        
        let score = 0; let expIdx = 0; let html = "";
        
        const flexSteps = ['remove_aretes', 'remove_reloj', 'cofia', 'cubrebocas', 'zapatones1'];
        // Orden oficial estricto a partir del lavado
        const expectedSequence = ['wash', 'dry', 'gel', 'guantes', 'alcohol', 'escafandra', 'alcohol', 'overol', 'alcohol', 'zapatones2', 'alcohol', 'goggles', 'alcohol'];

        let doneFlex = [];

        actionLog.forEach(action => {
            if (action.includes('error')) {
                html += `<div class="report-row score-bad"><span>❌ Fallo Crítico (${formatName(action)})</span><span>0 pts</span></div>`;
            } else if (action === 'fix_escafandra') {
                html += `<div class="report-row" style="color:#0284c7;"><span>✅ Acomodó escafandra</span><span>+5 pts extra</span></div>`;
                score += 5;
            } else if (flexSteps.includes(action)) {
                if (!doneFlex.includes(action)) {
                    html += `<div class="report-row score-good"><span>✔️ ${formatName(action)}</span><span>5 pts</span></div>`;
                    score += 5;
                    doneFlex.push(action);
                }
            } else {
                let expected = expectedSequence[expIdx];
                
                if (action === expected) {
                    html += `<div class="report-row score-good"><span>✔️ ${formatName(action)}</span><span>5 pts</span></div>`;
                    score += 5;
                    expIdx++;
                } else if (action === 'alcohol' && expected !== 'alcohol') {
                    // MEJORA: Ya no penaliza las sanitizaciones de más ni las rompe.
                    html += `<div class="report-row" style="color:#0284c7;"><span>✔️ Sanitización preventiva extra</span><span>--</span></div>`;
                } else {
                    html += `<div class="report-row score-bad"><span>⚠️ ${formatName(action)} (Fuera de orden)</span><span>0 pts</span></div>`;
                    // Resincronización del index para no arruinar el resto de la auditoría
                    let futureIdx = expectedSequence.indexOf(action, expIdx);
                    if (futureIdx !== -1) expIdx = futureIdx + 1;
                }
            }
        });

        // Revisar qué faltó
        while(expIdx < expectedSequence.length) {
            html += `<div class="report-row score-bad"><span>❌ Omitió: ${formatName(expectedSequence[expIdx])}</span><span>0 pts</span></div>`;
            expIdx++;
        }

        if (pState.escaMalPuesta) {
            html += `<div class="report-row score-bad"><span>❌ Finalizó con visión tapada</span><span>-5 pts</span></div>`;
            score -= 5;
        }

        let maxScore = (flexSteps.length + expectedSequence.length) * 5;
        content.innerHTML = html;
        document.getElementById('final-score').innerText = `Calificación Final: ${score} / ${maxScore}`;
        document.getElementById('final-score').style.color = score >= maxScore - 10 ? '#16a34a' : '#dc2626';
    }

    function formatName(id) {
        const d = { "remove_aretes": "Retirar Aretes", "remove_reloj": "Retirar Reloj", "cofia": "Cofia", "cubrebocas": "Cubrebocas", "zapatones1": "Zapatones Grises", "wash": "Lavado", "dry": "Secado", "gel": "Gel", "guantes": "Guantes", "alcohol": "Sanitizar Guantes", "escafandra": "Escafandra", "overol": "Overol", "zapatones2": "Zapatones Estériles", "goggles": "Goggles", "error_gorra": "Prenda Contaminada", "error_basura": "Tocar Basura", "error_banca": "Sentarse/Apoyarse" };
        return d[id] || id;
    }

    updatePlayerState();
    renderRoom(0);
</script>
